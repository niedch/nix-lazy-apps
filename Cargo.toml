[package]
name = "nix-lazy-apps"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
eframe = "0.37.0"
egui_extras = { version = "0.37.0", features = ["default", "image"]}
env_logger = "0.11.11"
regex = "1.13"
serde = "1.0.229"
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["full"] }

[lints.clippy]
panic = "warn"
unwrap_used = "warn"
expect_used = "warn"

