[package]
name = "nix-lazy-apps"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
eframe = "0.37.0"
regex = "1.13"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "process", "io-util", "time"] }

[lints.clippy]
panic = "warn"
unwrap_used = "warn"
expect_used = "warn"

